<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Bassem Jadoui — Co-Founder and CTO at SyntaxEror">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.45" stop-color="#2b2f5c"/>
      <stop offset="0.75" stop-color="#b8556a"/>
      <stop offset="1" stop-color="#f29a52"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.6" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ff9f4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4e7a"/>
      <stop offset="1" stop-color="#0b1d36"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <circle cx="60" cy="30" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="210" cy="60" r="1" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="380" cy="25" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle><circle cx="520" cy="70" r="1" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="660" cy="35" r="1.3" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle><circle cx="1010" cy="40" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="1120" cy="80" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle><circle cx="1170" cy="25" r="1" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="840" cy="22" r="1.1" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle><circle cx="300" cy="95" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="250" r="120" fill="url(#sun)"/>
    <circle cx="930" cy="250" r="58" fill="#ffd77a"/>

    <!-- ship -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4s" repeatCount="indefinite"/>
      <g transform="translate(770 178)" fill="#141a2e">
        <path d="M0 52 L150 52 L132 78 L16 78 Z"/>
        <rect x="70" y="-22" width="5" height="76"/>
        <rect x="38" y="4" width="5" height="50"/>
        <path d="M78 -16 Q118 6 78 44 Z"/>
        <path d="M46 8 Q78 24 46 48 Z"/>
        <path d="M75 -22 L98 -16 L75 -10 Z" fill="#e0453a"/>
      </g>
    </g>

    <!-- sea layers -->
    <path d="M0 262 Q60.0 254 120.0 262 T240 262 T360 262 T480 262 T600 262 T720 262 T840 262 T960 262 T1080 262 T1200 262 T1320 262 T1440 262 T1560 262 T1680 262 T1800 262 T1920 262 T2040 262 T2160 262 T2280 262 T2400 262 V340 H0 Z" fill="#24598a" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <path d="M0 280 Q75.0 270 150.0 280 T300 280 T450 280 T600 280 T750 280 T900 280 T1050 280 T1200 280 T1350 280 T1500 280 T1650 280 T1800 280 T1950 280 T2100 280 T2250 280 T2400 280 V340 H0 Z" fill="url(#sea)">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M0 305 Q50.0 298 100.0 305 T200 305 T300 305 T400 305 T500 305 T600 305 T700 305 T800 305 T900 305 T1000 305 T1100 305 T1200 305 T1300 305 T1400 305 T1500 305 T1600 305 T1700 305 T1800 305 T1900 305 T2000 305 T2100 305 T2200 305 T2300 305 T2400 305 V340 H0 Z" fill="#0a1a30" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <rect x="890" y="276" width="80" height="3" rx="1.5" fill="#ffd77a" opacity="0.5"/>
    <rect x="905" y="292" width="50" height="2" rx="1" fill="#ffd77a" opacity="0.35"/>

    <!-- straw hat -->
    <g transform="translate(118 92)">
      <ellipse cx="0" cy="22" rx="52" ry="14" fill="#e9b949"/>
      <path d="M-30 20 Q-30 -22 0 -22 Q30 -22 30 20 Z" fill="#f2c85b"/>
      <path d="M-30 12 Q0 20 30 12 L30 20 Q0 28 -30 20 Z" fill="#d23b33"/>
      <ellipse cx="0" cy="22" rx="52" ry="14" fill="none" stroke="#c99a2e" stroke-width="2"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="190" y="118" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="0.5">Bassem Jadoui</text>
      <text x="192" y="158" font-size="22" font-weight="600" fill="#8AD7F9">Co-Founder &amp; CTO @ SyntaxEror · Full-stack &amp; Test Automation</text>
      <text x="192" y="192" font-size="17" font-style="italic" fill="#f6d9b8" opacity="0.9">Sailing the Grand Line of code — one Devil Fruit, zero bugs left behind.</text>
    </g>
  </g>
</svg>
